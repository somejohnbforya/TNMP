    <script>
        // Boot watchdog: if the app bundle hasn't executed OR the
        // stylesheet failed to load within 8s, assume a wedged cache/
        // service worker (seen on iOS PWAs after rapid deploys) —
        // unregister the SW, clear caches, reload once.
        setTimeout(function () {
            var cssAlive = false;
            try {
                cssAlive = getComputedStyle(document.documentElement).getPropertyValue('--radius-card').trim() !== '';
            } catch (e) { /* treat as dead */ }
            if (window.__tnmpBooted && cssAlive) return;
            try {
                if (sessionStorage.getItem('tnmp-boot-retry')) return; // one retry only
                sessionStorage.setItem('tnmp-boot-retry', '1');
            } catch (e) { /* storage unavailable — just reload */ }
            var done = function () { location.reload(); };
            var tasks = [];
            if ('serviceWorker' in navigator) {
                tasks.push(navigator.serviceWorker.getRegistrations()
                    .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            }
            if (window.caches && caches.keys) {
                tasks.push(caches.keys()
                    .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            }
            Promise.all(tasks).then(done, done);
        }, 8000);
    </script>

            </div>

            <span class="footer-divider" aria-hidden="true">•</span>
            <button type="button" class="footer-link" data-action="open-settings" aria-label="Open settings">Settings</button>
            <span class="footer-divider" aria-hidden="true">•</span>
            <button type="button" class="footer-link" data-action="open-style" aria-label="Open style settings">Style</button>
            <span class="footer-divider" aria-hidden="true">•</span>

            <span class="footer-divider" aria-hidden="true">•</span>
            <button type="button" class="footer-link" data-action="open-privacy" aria-label="Privacy policy">Privacy</button>
        </div>

    <!-- About tab content — adopted into the settings panel by settings.js -->
    <template id="settings-about-template">
            <div class="about-body">
                <p><strong>Are the Pairings Up?</strong> is a companion app for the
                <a href="https://www.milibrary.org/chess/tournaments/" target="_blank" rel="noopener">Tuesday Night Marathon</a>
                at the Mechanics' Institute in San Francisco.</p>
                <p>Get instant answers on pairings and results, with optional push notifications. Browse and replay games with a built-in PGN viewer, explore opening trends across the tournament, and view player profiles with stats and game history.</p>
                <p class="about-disclaimer">This is an independent project and is <strong>not affiliated with or endorsed by</strong> the Mechanics' Institute.</p>
                <p class="about-credit">Built with Cloudflare Workers, Pages &amp; D1. <a href="/architecture" target="_blank" rel="noopener">See how</a>.</p>
            </div>
            <details class="privacy-details" id="privacy-details">
                <summary>Privacy — no cookies, no analytics, no tracking. Full policy</summary>
            <div class="privacy-body">
                <p class="privacy-updated">Last updated: March 21, 2026</p>

                <h3>What This App Does</h3>
                <p><strong>Are the Pairings Up?</strong> is an independent companion app for the Tuesday Night Marathon chess tournament at the Mechanics' Institute in San Francisco. It checks pairings and results, sends optional push notifications, and provides a game browser, PGN viewer, opening explorer, and player profiles.</p>

                <h3>Data We Collect</h3>
                <h4>Player Name</h4>
                <p>If you enter your name in Settings, it is stored in your browser's local storage only. It is used to find your pairing in the tournament data. If you enable push notifications, your name is also sent to our server so we can include your pairing details in the notification.</p>

                <h4>Push Notifications (subscribers only)</h4>
                <p>If you enable push notifications, the following is stored on our server:</p>
                <ul>
                    <li><strong>Push endpoint URL</strong> — generated by your browser vendor (e.g. Google or Apple), used solely to deliver notifications. Does not contain personal information.</li>
                    <li><strong>Player name and notification preferences</strong> (pairings/results).</li>
                    <li><strong>Device identifier</strong> — a random UUID assigned to your device, used to manage your subscription. Not linked to any hardware or account ID.</li>
                    <li><strong>Device label</strong> — a browser/OS description (e.g. "Chrome on Android"), used for your reference only.</li>
                    <li><strong>Delivery timestamps</strong> — when notifications were sent, displayed, and clicked, used to detect failed deliveries and avoid duplicate notifications.</li>
                </ul>

                <h4>Game Data</h4>
                <p>Tournament game data (player names, results, PGN move records) is sourced from publicly posted tournament pages and stored in our database. This is public tournament information, not user-submitted personal data.</p>

                <h4>IP Address</h4>
                <p>Your IP address is used solely for rate limiting API requests. It is stored temporarily with an automatic 5-minute expiration. It is not logged or retained beyond that.</p>

                <h3>Local Storage</h3>
                <p>The app caches game data, your player name, display preferences, and round history in your browser's local storage to enable offline access and faster load times. This data never leaves your device unless you enable push notifications (in which case only your player name is sent to the server).</p>

                <h3>Third-Party Services</h3>
                <p>This app is hosted on <strong>Cloudflare</strong> Pages, Workers, and D1. Push subscription data is stored in Cloudflare KV; game data is stored in Cloudflare D1. See <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">Cloudflare's Privacy Policy</a>.</p>

                <h3>Cookies and Tracking</h3>
                <p>This app uses <strong>no cookies, no analytics, and no tracking</strong> of any kind. There are no third-party scripts, advertising, or data brokers.</p>

                <h3>Data Retention</h3>
                <p>Push notification records expire automatically after 90 days of inactivity and are permanently deleted when you disable notifications. Game data is retained indefinitely as a public archive of tournament results. Rate limit records expire automatically after 5 minutes. Browser local storage persists until you clear it.</p>

                <h3>Your Rights</h3>
                <ul>
                    <li><strong>Disable push notifications</strong> at any time via Settings. This permanently deletes your server-side subscription record.</li>
                    <li><strong>Clear local data</strong> by clearing your browser's site data for tnmpairings.com, or by removing your name in Settings.</li>
                </ul>

                <h3>Contact</h3>
                <p>Questions about this policy? Email <a href="mailto:info@tnmpairings.com">info@tnmpairings.com</a>.</p>
            </div>
            </details>
            <div class="modal-buttons settings-about-cta">

            </div>
    </template>

    <!-- GIF Maker Modal -->
    <div id="gif-maker-modal" class="modal hidden" role="dialog" aria-labelledby="gif-maker-title" aria-modal="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-content-wide gif-maker-content">
            <button data-close-modal class="modal-close-btn" aria-label="Close">✕</button>
            <h2 id="gif-maker-title">Share as Video</h2>

            <div class="gif-maker-body">

                <!-- ─── LEFT: inputs + style + behavior ─── -->
                <div class="gif-maker-inputs">

                    <label class="gif-maker-label" for="gif-pgn-input">PGN</label>
                    <textarea
                        id="gif-pgn-input"
                        class="gif-pgn-input"
                        placeholder="Paste or drop a PGN here..."
                        spellcheck="false"
                        autocomplete="off"></textarea>
                    <div id="gif-pgn-status" class="gif-pgn-status"></div>

                    <label class="gif-maker-label">Pieces</label>
                    <div id="gif-pieces-dropdown" class="style-dropdown">
                        <button type="button" class="style-dropdown-trigger"></button>
                        <div class="style-dropdown-menu"></div>
                    </div>

                    <label class="gif-maker-label">Board</label>
                    <div class="style-board-row">
                        <div id="gif-board-dropdown" class="style-dropdown">
                            <button type="button" class="style-dropdown-trigger"></button>
                            <div class="style-dropdown-menu"></div>
                        </div>
                        <input type="color" id="gif-board-light" class="color-picker" title="Light squares" value="#dee3e6">
                        <input type="color" id="gif-board-dark" class="color-picker" title="Dark squares" value="#8ca2ad">
                    </div>

                    <div class="gif-behavior raised-panel">
                        <div class="gif-behavior-row" id="gif-format-row">
                            <label class="gif-maker-label">Format</label>
                            <div class="gif-timing-options" id="gif-format-options">
                                <label><input type="radio" name="gif-format" value="mp4" checked> Video (MP4)</label>
                                <label><input type="radio" name="gif-format" value="gif"> GIF loop</label>
                            </div>
                        </div>

                        <div class="gif-behavior-row">
                            <label class="gif-maker-label">Time per move</label>
                            <div class="gif-timing-options" id="gif-timing-options">
                                <label><input type="radio" name="gif-timing" value="fast"> Fast</label>
                                <label><input type="radio" name="gif-timing" value="medium" checked> Medium</label>
                                <label><input type="radio" name="gif-timing" value="slow"> Slow</label>
                                <label><input type="radio" name="gif-timing" value="custom"> Custom</label>
                            </div>
                            <input
                                type="number"
                                id="gif-timing-custom-ms"
                                class="gif-custom-ms hidden"
                                min="50" max="5000" step="50" value="600"
                                aria-label="Custom milliseconds per move">
                        </div>

                        <div class="gif-behavior-row">
                            <label class="gif-checkbox">
                                <input type="checkbox" id="gif-flip-board">
                                Flip board (black perspective)
                            </label>
                            <label class="gif-checkbox">
                                <input type="checkbox" id="gif-final-hold">
                                Hold final frame
                            </label>
                        </div>
                    </div>
                </div>

                <!-- ─── RIGHT: stage (preview ↔ result) + action ─── -->
                <div class="gif-maker-output">

                    <div class="gif-stage raised-panel">
                        <!-- Live preview (default) -->
                        <div id="gif-preview-pane" class="gif-preview-pane">
                            <div id="gif-preview" class="gif-preview"></div>
                            <div class="gif-scrubber-wrap">
                                <input
                                    type="range"
                                    id="gif-scrubber"
                                    class="gif-scrubber"
                                    min="0" max="0" value="0" step="1"
                                    aria-label="Preview frame">
                                <div class="gif-frame-counter">
                                    <span id="gif-frame-current">0</span> / <span id="gif-frame-total">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Result (shown after Generate) -->
                        <div id="gif-result" class="gif-result hidden">
                            <img id="gif-result-img" class="gif-result-img hidden" alt="Generated GIF preview">
                            <video id="gif-result-video" class="gif-result-img hidden" controls playsinline></video>
                            <div class="gif-result-actions">
                                <button id="gif-share-btn" class="modal-btn modal-btn-primary hidden">Share…</button>
                                <button id="gif-download-btn" class="modal-btn modal-btn-primary">Download</button>
                                <button id="gif-regen-btn" class="modal-btn modal-btn-secondary">Regenerate</button>
                            </div>
                        </div>
                    </div>

                    <div class="gif-action-row">
                        <button id="gif-generate-btn" class="modal-btn modal-btn-primary" disabled>
                            Generate GIF
                        </button>
                        <div id="gif-progress" class="gif-progress hidden">
                            <div class="gif-progress-bar"><div id="gif-progress-fill" class="gif-progress-fill"></div></div>
                            <div id="gif-progress-text" class="gif-progress-text">Encoding…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/app.js"></script>
</body>
